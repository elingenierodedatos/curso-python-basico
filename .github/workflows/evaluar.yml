# Corre las pruebas del curso en Windows, macOS y Linux cada vez que subes cambios.
# Ubicación en el repositorio: .github/workflows/evaluar.yml
name: Evaluar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas en ${{ matrix.sistema }} con Python ${{ matrix.python }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Mostrar el avance
        run: python progreso.py --json
        env:
          PYTHONUTF8: "1"

      # Los pasos siguientes llevan "if: always()" para que se ejecuten aunque
      # un paso anterior falle: así siempre ves el resumen y la revisión de estilo.
      - name: Publicar el avance en el resumen
        if: always()
        shell: python
        env:
          PYTHONUTF8: "1"
        run: |
          import json
          import os
          from pathlib import Path

          datos = json.loads(Path("progreso.json").read_text(encoding="utf-8"))
          lineas = ["## Tu avance", "", "| Unidad | Aprobadas | Total |", "| --- | --- | --- |"]
          for unidad in datos["unidades"]:
              lineas.append(f"| {unidad['unidad']} | {unidad['aprobadas']} | {unidad['total']} |")
          lineas.append(f"| **Total** | **{datos['aprobadas']}** | **{datos['total']}** |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as resumen:
              resumen.write("\n".join(lineas) + "\n")

      - name: Revisar el estilo
        if: always()
        run: ruff check .

      # Informativo mientras las lecciones no enseñen "ruff format": si hay
      # archivos sin formato, el paso lo marca, pero no pone el job en rojo.
      - name: Revisar el formato (informativo)
        if: always()
        continue-on-error: true
        run: ruff format --check .
